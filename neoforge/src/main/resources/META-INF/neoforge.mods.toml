modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
description = '''${description}'''
logoFile = "assets/${mod_id}/logo.png"
authors = "${mod_author}"
credits = "${credits}"

[[dependencies.${ mod_id }]]
modId = "neoforge"
mandatory = true
versionRange = "${neoforge_version}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
