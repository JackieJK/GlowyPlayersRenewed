# Gradle settings
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=false
# Fabric Loom decompiler memory
loom.decompiler.maxMemory=1g

# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.
# Project
version=1.1.0
group=com.github.glowy-players-renewed
java_version=25

# Common
minecraft_version=26.1.2
minecraft_version_range=[26,27)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.1.2-1

# NeoForge
neoforge_version=26.1.2.7-beta
neoforge_loader_version_range=[4,)

# Fabric
fabric_version=0.145.4+26.1.2
fabric_loader_version=0.18.6

# Mod options
mod_name=Glowy-Players-Renewed
mod_author=JackieJK,HiAndyFan
mod_id=glowyplayers
license=MIT
credits=
description=Makes players glow so they can see each other.
home_page=https://github.com/JackieJK/GlowyPlayersRenewed
issue_tracker_url=https://github.com/JackieJK/GlowyPlayersRenewed/issues

